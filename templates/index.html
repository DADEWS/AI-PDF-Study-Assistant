<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI PDF Study Assistant</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>


<body>

    <h1>AI PDF Study Assistant</h1>

    <p>Upload a PDF to summarize and ask questions.</p>

    <label for="languageSelect">Output Language</label>

    <select id="languageSelect">
        <option value="th">ไทย</option>
        <option value="en">English</option>
    </select>
    
    <section>
        <h2>Upload PDF</h2>
        <div class="input-row">
            <input type="file" id="pdfFile" accept=".pdf">

            <button type="button" id="uploadButton">
                Upload
            </button>
        </div>
        <p id="uploadStatus"></p>
    </section>

    <section id="summarySection" hidden>
        <h2>Summary</h2>
        <pre id="summary"></pre>
    </section>
    
    <section>
        <h2>Ask PDF</h2>
        <div class="input-row">
            <input
                type="text"
                id="questionInput"
                placeholder="Ask a question about the PDF"
            >

            <button type="button" id="askButton" disabled>
                Ask
            </button>
        </div>
        <p id="askStatus"></p>

       
    </section>

    <section id="answerSection" hidden>
         <h2>Answer</h2>
        <pre id="answer"></pre>
    </section>

    <script src="/static/js/app.js"></script>


</body>
</html>
